name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk nova-tv.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: nova-tv
          path: nova-tv.apk

      # Puts the APK at .../releases/download/latest/nova-tv.apk
      # so the Downloader app on the TV can grab it.
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: nova-tv.apk
          make_latest: true
